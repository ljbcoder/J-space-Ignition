[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "jreflect"
version = "0.1.0"
description = "Reproducible readout-trained self-correction experiments"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
analysis = ["numpy>=1.26", "scipy>=1.12", "scikit-learn>=1.4", "matplotlib>=3.8"]
model = ["torch>=2.4", "transformers>=4.51,<6", "datasets>=3", "accelerate>=1", "peft>=0.15", "huggingface-hub>=0.30", "safetensors>=0.4"]
dev = ["pytest>=8", "ruff>=0.9"]

[project.scripts]
jreflect = "jreflect.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["model: local tiny neural model tests (no downloaded weights)", "jpp: upstream integration tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
